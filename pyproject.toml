[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recovery-room"
version = "0.1.0"
description = "Evidence-linked investigation and repair rehearsal for a bounded import incident."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
recovery-room = "recovery_room.cli:main"

[tool.setuptools.packages.find]
include = ["recovery_room*"]

[tool.setuptools.package-data]
recovery_room = ["web/*.html", "web/*.css", "web/*.js", "web/fonts/*.woff2", "web/fonts/OFL.txt"]
